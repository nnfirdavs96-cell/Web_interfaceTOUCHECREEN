name: hikv

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hikv
      POSTGRES_PASSWORD: hikv
      POSTGRES_DB: hikv
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hikv"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks: [internal]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [internal, public]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "80:80"
    networks: [public]

networks:
  internal:
  public:

volumes:
  pg_data:
  redis_data:
