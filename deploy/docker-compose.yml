name: hikv

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hikv
      POSTGRES_PASSWORD: hikv
      POSTGRES_DB: hikv
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hikv"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks: [internal]

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    env_file:
      - ../backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    networks: [internal, public]

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    depends_on:
      - backend
      - mediamtx
    ports:
      - "8090:80"
    networks: [public]

  mediamtx:
    image: bluenviron/mediamtx:latest
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
    # WebRTC(8889)/HLS(8888)/API(9997) — через nginx. UDP 8189 — WebRTC ICE.
    ports:
      - "8189:8189/udp"
    networks: [internal, public]

networks:
  internal:
  public:

volumes:
  pg_data:
  redis_data:
