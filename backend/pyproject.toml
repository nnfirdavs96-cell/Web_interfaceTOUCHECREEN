[project]
name = "hikvision-access-backend"
version = "0.1.0"
description = "Hikvision Access Control web platform — backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "email-validator>=2.2",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "asyncpg>=0.30",
    "redis>=5.2",
    "celery>=5.4",
    "httpx>=0.28",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "cryptography>=43",
    "openpyxl>=3.1",
    "reportlab>=4.2",
    "slowapi>=0.1.9",
]

[tool.ruff]
line-length = 100
target-version = "py312"
